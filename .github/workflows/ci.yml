name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias leves de teste
        run: python -m pip install numpy PyYAML opencv-python-headless pytest ruff
      - name: Validar estilo
        run: python -m ruff check src tests scripts
      - name: Executar testes
        run: PYTHONPATH=src python -m pytest -q

