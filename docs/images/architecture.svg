<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura YOLO U-Net SlowFast</title>
  <desc id="desc">Fluxo do video de entrada ate o video anotado e as metricas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#7dd3fc"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1120" height="350" rx="24" fill="url(#bg)"/>
  <text x="48" y="54" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26" font-weight="700">Pipeline de deteccao de acoes humanas</text>
  <text x="48" y="82" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Modelos pre-treinados, sem ajuste de pesos</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="45" y="125" width="150" height="118" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="120" y="168" fill="#dbeafe" font-size="20" font-weight="700" text-anchor="middle">VIDEO</text>
    <text x="120" y="199" fill="#93c5fd" font-size="14" text-anchor="middle">quadros BGR</text>
    <text x="120" y="220" fill="#93c5fd" font-size="14" text-anchor="middle">+ FPS</text>

    <rect x="260" y="125" width="170" height="118" rx="16" fill="#3b1d18" stroke="#fb923c" stroke-width="2"/>
    <text x="345" y="165" fill="#ffedd5" font-size="21" font-weight="700" text-anchor="middle">YOLO</text>
    <text x="345" y="196" fill="#fdba74" font-size="14" text-anchor="middle">pessoa + caixa</text>
    <text x="345" y="217" fill="#fdba74" font-size="14" text-anchor="middle">+ confianca</text>

    <rect x="495" y="125" width="170" height="118" rx="16" fill="#123329" stroke="#4ade80" stroke-width="2"/>
    <text x="580" y="165" fill="#dcfce7" font-size="21" font-weight="700" text-anchor="middle">U-NET</text>
    <text x="580" y="196" fill="#86efac" font-size="14" text-anchor="middle">mascara no recorte</text>
    <text x="580" y="217" fill="#86efac" font-size="14" text-anchor="middle">reprojetada no quadro</text>

    <rect x="730" y="125" width="170" height="118" rx="16" fill="#2e1a47" stroke="#c084fc" stroke-width="2"/>
    <text x="815" y="165" fill="#f3e8ff" font-size="21" font-weight="700" text-anchor="middle">SLOWFAST</text>
    <text x="815" y="196" fill="#d8b4fe" font-size="14" text-anchor="middle">janela temporal</text>
    <text x="815" y="217" fill="#d8b4fe" font-size="14" text-anchor="middle">acao + confianca</text>

    <rect x="965" y="125" width="110" height="118" rx="16" fill="#203044" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1020" y="163" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">SAIDA</text>
    <text x="1020" y="192" fill="#cbd5e1" font-size="13" text-anchor="middle">MP4</text>
    <text x="1020" y="213" fill="#cbd5e1" font-size="13" text-anchor="middle">CSV + JSON</text>
  </g>

  <g stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M195 184H248"/>
    <path d="M430 184H483"/>
    <path d="M120 125V108H815V125"/>
    <path d="M580 243V270H1020V243"/>
    <path d="M900 184H953"/>
  </g>
  <text x="450" y="103" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">quadros originais em janelas temporais</text>
  <text x="560" y="305" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Composicao offline: caixa + mascara + acao sobre os quadros da mesma janela</text>
</svg>

